[package]
name = "rust-ro-bot"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.9"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smolgent = { git = "https://github.com/pts1667/smolgent", rev = "07a6421" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3.34", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["net", "io-util"] }
